[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "document-to-dataset-pipeline"
version = "0.1.0"
description = "A config-driven pipeline for converting documents into validated datasets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
ocr = [
    "Pillow>=10,<13",
    "PyMuPDF>=1.24,<2",
    "pytesseract>=0.3.13,<1",
]
spark = [
    "pyspark>=3.5,<5",
]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
